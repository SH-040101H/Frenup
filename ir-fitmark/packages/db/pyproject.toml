[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "db"
version = "1.0.0"
description = "Database models and migrations for IR FitMark"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "IR FitMark Team" },
]

dependencies = [
    "sqlmodel>=0.0.14",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.5.0",
    "pyshared @ file://../../packages/pyshared",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "black>=23.12.0",
    "isort>=5.13.0",
    "ruff>=0.1.8",
    "mypy>=1.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/db"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/alembic",
    "/alembic.ini",
    "/README.md",
]

[tool.black]
line-length = 88
target-version = ['py312']

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["db", "pyshared"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.mypy]
python_version = "3.12"
plugins = ["sqlalchemy.ext.mypy.plugin"]