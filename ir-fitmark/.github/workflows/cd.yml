name: CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  NODE_VERSION: 18
  PYTHON_VERSION: 3.12

jobs:
  # Build and Push Docker Images
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api, web, admin, worker]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  # Deploy to Staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig

      - name: Deploy to staging
        run: |
          export KUBECONFIG=kubeconfig
          kubectl set image deployment/ir-fitmark-api api=${{ env.REGISTRY }}/${{ github.repository }}/api:${{ github.sha }}
          kubectl set image deployment/ir-fitmark-web web=${{ env.REGISTRY }}/${{ github.repository }}/web:${{ github.sha }}
          kubectl set image deployment/ir-fitmark-admin admin=${{ env.REGISTRY }}/${{ github.repository }}/admin:${{ github.sha }}
          kubectl set image deployment/ir-fitmark-worker worker=${{ env.REGISTRY }}/${{ github.repository }}/worker:${{ github.sha }}
          kubectl rollout status deployment/ir-fitmark-api
          kubectl rollout status deployment/ir-fitmark-web
          kubectl rollout status deployment/ir-fitmark-admin
          kubectl rollout status deployment/ir-fitmark-worker

      - name: Run smoke tests
        run: |
          # Add smoke tests here
          echo "Running smoke tests against staging environment"
          # curl -f https://staging-api.irfitmark.com/health
          # curl -f https://staging.irfitmark.com

  # Deploy to Production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig

      - name: Deploy to production
        run: |
          export KUBECONFIG=kubeconfig
          kubectl set image deployment/ir-fitmark-api api=${{ env.REGISTRY }}/${{ github.repository }}/api:${{ github.sha }}
          kubectl set image deployment/ir-fitmark-web web=${{ env.REGISTRY }}/${{ github.repository }}/web:${{ github.sha }}
          kubectl set image deployment/ir-fitmark-admin admin=${{ env.REGISTRY }}/${{ github.repository }}/admin:${{ github.sha }}
          kubectl set image deployment/ir-fitmark-worker worker=${{ env.REGISTRY }}/${{ github.repository }}/worker:${{ github.sha }}
          kubectl rollout status deployment/ir-fitmark-api
          kubectl rollout status deployment/ir-fitmark-web
          kubectl rollout status deployment/ir-fitmark-admin
          kubectl rollout status deployment/ir-fitmark-worker

      - name: Run production smoke tests
        run: |
          # Add production smoke tests here
          echo "Running smoke tests against production environment"
          # curl -f https://api.irfitmark.com/health
          # curl -f https://irfitmark.com

      - name: Notify deployment success
        uses: 8398a7/action-slack@v3
        if: success()
        with:
          status: success
          channel: '#deployments'
          text: 'Production deployment successful! :rocket:'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify deployment failure
        uses: 8398a7/action-slack@v3
        if: failure()
        with:
          status: failure
          channel: '#deployments'
          text: 'Production deployment failed! :x:'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # Update Documentation
  update-docs:
    name: Update Documentation
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Generate API documentation
        run: |
          # Generate OpenAPI docs
          echo "Generating API documentation"
          # Add commands to generate and publish API docs

      - name: Deploy documentation
        run: |
          # Deploy to GitHub Pages or documentation hosting
          echo "Deploying documentation"

  # Security Scan on Production Images
  security-scan-production:
    name: Security Scan Production Images
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        service: [api, web, admin, worker]
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results-${{ matrix.service }}.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results-${{ matrix.service }}.sarif'